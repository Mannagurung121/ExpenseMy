# REQUIRES: Apple Developer credentials configured in GitHub Secrets. See docs/secrets-setup.md

name: Beta (TestFlight)

on:
  push:
    branches:
      - main
    # Explicitly exclude PR events — only merged commits trigger this
    # (GitHub does not fire push events for PRs, but this makes intent clear)

jobs:
  beta:
    name: Deploy to TestFlight
    runs-on: macos-15

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install Fastlane via Bundler
        run: bundle install

      - name: Run Fastlane beta lane
        run: bundle exec fastlane beta

      - name: Extract build metadata
        id: metadata
        run: |
          # Read the version and build number that Fastlane just stamped into the project.
          # Adjust the path to Info.plist or use agvtool if your setup differs.
          BUILD_NUMBER=$(agvtool what-version -terse 2>/dev/null || echo "unknown")
          MARKETING_VERSION=$(agvtool what-marketing-version -terse1 2>/dev/null || echo "unknown")
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Comment build info on commit
        uses: actions/github-script@v7
        with:
          script: |
            const buildNumber = '${{ steps.metadata.outputs.build_number }}';
            const version     = '${{ steps.metadata.outputs.marketing_version }}';
            const sha         = context.sha;
            const shortSha    = sha.substring(0, 7);

            await github.rest.repos.createCommitComment({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              commit_sha: sha,
              body: [
                '### TestFlight Build Deployed :rocket:',
                '',
                `| Field          | Value           |`,
                `|----------------|-----------------|`,
                `| Version        | \`${version}\`  |`,
                `| Build Number   | \`${buildNumber}\` |`,
                `| Commit         | \`${shortSha}\` |`,
                `| Workflow run   | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
                '',
                'The build is now processing in App Store Connect and will appear in TestFlight shortly.'
              ].join('\n')
            });
