# SonarCloud configuration for ExpenseMy
# =========================================================================
# Consumed by sonar-scanner (run from .github/workflows/sonar.yml).
#
# REQUIRES: a SonarCloud account linked to this repository. The
# `projectKey` and `organization` below are placeholders derived from the
# GitHub owner/repo (Mannagurung121/ExpenseMy) — UPDATE THEM to match the
# values SonarCloud assigns after you import the repo. See
# docs/sonarcloud-setup.md for the full setup.
# =========================================================================

# Unique project identifier in SonarCloud. SonarCloud's GitHub import
# defaults this to "<owner>_<repo>". Confirm/replace after setup.
sonar.projectKey=Mannagurung121_ExpenseMy

# Your SonarCloud organization key (lowercase). Usually the GitHub org/user
# in lowercase. Confirm/replace after setup.
sonar.organization=mannagurung121

# Human-readable name shown on the SonarCloud dashboard.
sonar.projectName=ExpenseMy

# Directory containing the production app source to analyse.
sonar.sources=ExpenseMy

# Test source directories — analysed but reported separately from main code
# (kept out of duplication/coverage-of-tests metrics).
sonar.tests=ExpenseMyTests,ExpenseMyUITests

# Paths excluded from analysis: generated asset catalogs, Interface Builder
# storyboards, and the Firebase config (never analyse secrets/config).
sonar.exclusions=**/*.xcassets/**, **/*.storyboard, **/GoogleService-Info.plist

# Coverage report consumed by SonarCloud, in the generic coverage XML format.
# Produced in CI by converting the xcresult bundle (see sonar.yml).
sonar.swift.coverage.reportPaths=sonarqube-generic-coverage.xml

# Source file encoding — UTF-8 for all Swift files.
sonar.sourceEncoding=UTF-8
