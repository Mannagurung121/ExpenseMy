excluded:
  - ExpenseMy.xcodeproj
  - build
  - .build
  - DerivedData

disabled_rules:
  - type_body_length

opt_in_rules:
  - empty_count
  - missing_docs

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 60
  error: 100

force_cast: warning
